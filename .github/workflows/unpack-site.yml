name: Unpack site bundle
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack audited site
        run: |
          if [ -f site.tgz ]; then
            tar -xzf site.tgz -C .
            rm site.tgz
          fi
      - name: Commit unpacked site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No unpack changes to commit"
          else
            git commit -m "Add complete Ulster E-Waste directory site"
            git push
          fi
