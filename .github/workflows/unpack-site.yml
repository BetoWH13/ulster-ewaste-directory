name: Install audited site
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and unpack audited site
        run: |
          cat .bootstrap/part*.txt > site.tgz.b64
          base64 -d site.tgz.b64 > site.tgz
          gzip -t site.tgz
          tar -xzf site.tgz -C .
          rm -f site.tgz site.tgz.b64
          rm -rf .bootstrap
          rm -f .github/workflows/unpack-site.yml
      - name: Commit complete site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete Ulster E-Waste directory site"
          git push
